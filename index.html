<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>The Frame Run</title>
  <link rel="shortcut icon" href="TemplateData/Icon.png">
  <link rel="manifest" href="manifest.json">
 
 <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    
    }

    #unity-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
     /* ✅ Splash Background */
   

    /* 🌐 شاشة الروتيشن */
    #RotateWarningScreen {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #RotateWarningScreen img {
      max-width: 200px;
    }

    /* 🟨 شاشة الفول سكرين */
    #FullscreenPrompt {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000; /* أو حط صورة */
      z-index: 9998;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }

   #FullscreenPrompt img.logo {
  width: 80%;
  max-width: 600px;
  height: auto;
  margin-bottom: 60px;
  object-fit: contain;
}

    #fullscreen-prompt-box {
      position: absolute;
      bottom: 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      justify-content: center;
      width: 100%;
      font-size: 18px;
    }

    #fullscreen-prompt-box img {
      width: 48px;
      height: 48px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #fullscreen-prompt-box img:hover {
      transform: scale(1.1);
    }
	#installBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      color: black;
      border: none;
      padding: 10px 16px;
      font-size: 16px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      cursor: pointer;
      z-index: 9999;
      align-items: center;
      display: none;
    }

    #installBtn img {
      height: 20px;
      vertical-align: middle;
      margin-right: 8px;
    }

     #LoadingSplash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background: url("TemplateData/Loading.png") no-repeat center center;
      background-size: cover;
    }

    /* ✅ Loading Text */
    #loading-text {
      position: absolute;
      bottom: 150px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 16px;
      color: white;
      text-shadow: 1px 1px 2px black;
    }

    /* ✅ Stylized Loading Bar */
    #custom-loading-bar {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 40%;
      height: 20px;
      background-color: #1f1f1f;
      border-radius: 12px;
      border: 2px solid white;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    #custom-loading-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #FFA500;
      border-radius: 12px 0 0 12px;
      transition: width 0.3s ease;
    }

  </style>
</head>

<body>
 <!-- ✅ Splash Screen with Loading -->
  
  <!-- ✅ شاشة الروتيشن Portrait فقط -->
  <div id="RotateWarningScreen">
    <img src="TemplateData/lg.png" alt="Rotate your device">
  </div>

  <!-- ✅ شاشة الفول سكرين Landscape فقط -->
  <div id="FullscreenPrompt">
    <img src="TemplateData/fullscreen.png" alt="Logo" class="logo">
    <div id="fullscreen-prompt-box">
      <img src="TemplateData/Ficon.png" alt="Enter Fullscreen" onclick="goFullscreen()">
     
	 
	  
      <span>For the best gaming experience, switch to full screen.</span>
    </div>
  </div>


<div id="LoadingSplash">
    <div id="loading-text"></div>
    <div id="custom-loading-bar">
      <div id="custom-loading-bar-fill"></div>
    </div>
  </div>
  <!-- ✅ Unity Canvas -->
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>
<button id="installBtn">
    <img src="TemplateData/install-icon.png" alt="Install">
    Install The App
  </button>
  <!-- ✅ Unity Loader Script -->
  <script>
    
    const rotateScreen = document.getElementById("RotateWarningScreen");
    const fullscreenPrompt = document.getElementById("FullscreenPrompt");
     const splash = document.querySelector("#LoadingSplash");
    const barFill = document.querySelector("#custom-loading-bar-fill");

    function checkOrientation() {
      if (window.innerHeight > window.innerWidth) {
        rotateScreen.style.display = "flex";       // Show rotate
        fullscreenPrompt.style.display = "none";   // Hide fullscreen
      } else {
        rotateScreen.style.display = "none";       // Hide rotate
        fullscreenPrompt.style.display = "flex";   // Show fullscreen
      }
    }
function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
  function goFullscreen() {
      const elem = document.documentElement;
	  if (isIOS()) {
        fullscreenPrompt.style.display = "none";
} else {
  console.log("🖥️ Not an iOS device");
}
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.mozRequestFullScreen) {
        elem.mozRequestFullScreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    }
document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement) {
        fullscreenPrompt.style.display = "none";
      }
    });
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js')
    .then(() => console.log("✅ Service Worker registered"))
    .catch((err) => console.error("❌ SW failed", err));
}


    window.addEventListener("resize", checkOrientation);
    window.addEventListener("orientationchange", checkOrientation);
    checkOrientation();
window.addEventListener('beforeinstallprompt', (e) => {
  console.log("✅ beforeinstallprompt fired");
});

    // Unity loader
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Build.loader.js";
    var config = {
      dataUrl: buildUrl + "/Build.data",
      frameworkUrl: buildUrl + "/Build.framework.js",
      codeUrl: buildUrl + "/Build.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Endless Runner",
      productVersion: "0.1",
    };

    const canvas = document.querySelector("#unity-canvas");
    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        // optional loading bar here
                barFill.style.width = (progress * 100) + "%";

      }).then((unityInstance) => {
        splash.style.display = "none";
      }).catch((message) => {
        alert(message);
      });
    };
	let deferredPrompt;
const installBtn = document.getElementById("installBtn");

// Listen for installable event
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  //installBtn.style.display = 'inline-flex'; // Make it visible
  console.log("Install prompt available");
});

// On click, show the prompt
installBtn.addEventListener('click', () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === 'accepted') {
        console.log('User accepted install');
      } else {
        console.log('User dismissed install');
      }
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });
  }
});
  if (isRunningStandalone()) {
    console.log("✅ Running as a PWA (standalone mode)");
    installBtn.style.display = "none"; // Hide the install button
        fullscreenPrompt.style.display = "none";
  } else {
    console.log("❌ Running in the browser");
  }

function isRunningStandalone() {
  return (window.navigator.standalone === true) // iOS Safari PWA
      || (window.matchMedia('(display-mode: standalone)').matches); // Android & iOS newer
}

    document.body.appendChild(script);
	
  </script>
</body>
</html>
